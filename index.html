<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능특강 단어 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0e17;
  --surface: #1a1828;
  --card: #221f35;
  --accent: #ff6b35;
  --accent2: #ffd700;
  --text: #fffffe;
  --muted: #a7a9be;
  --success: #2cb67d;
  --error: #ef4565;
  --border: #2e2b45;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Sans KR", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.header {
  width: 100%;
  background: var(--surface);
  border-bottom: 2px solid var(--accent);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-title {
  font-family: "Space Mono", monospace;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.streak-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
}
.main {
  width: 100%;
  max-width: 480px;
  padding: 24px 16px;
  flex: 1;
}
/* HOME */
.home-screen { text-align: center; padding-top: 32px; }
.home-hero { font-size: 52px; font-weight: 900; line-height: 1.1; margin-bottom: 8px; }
.home-hero span { color: var(--accent); }
.home-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 32px; }
.stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 8px; text-align: center; }
.stat-num { font-family: "Space Mono", monospace; font-size: 22px; font-weight: 700; color: var(--accent2); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.mode-btn { background: var(--card); border: 2px solid var(--border); border-radius: 16px; padding: 20px 12px; cursor: pointer; transition: all 0.2s; text-align: center; color: var(--text); }
.mode-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
.mode-btn .mode-icon { font-size: 28px; margin-bottom: 8px; }
.mode-btn .mode-name { font-weight: 700; font-size: 14px; }
.mode-btn .mode-desc { font-size: 11px; color: var(--muted); margin-top: 4px; }
.mode-btn.highlight { border-color: var(--accent); background: #2a1f35; }
.start-btn-full { width: 100%; background: var(--accent); color: var(--text); border: none; border-radius: 14px; padding: 18px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: "Noto Sans KR", sans-serif; }
.start-btn-full:hover { background: #ff8555; transform: translateY(-1px); }
/* QUIZ */
.quiz-screen { display: none; }
.progress-bar-wrap { background: var(--card); border-radius: 99px; height: 6px; margin-bottom: 8px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }
.progress-label { font-family: "Space Mono", monospace; font-size: 12px; color: var(--muted); text-align: right; margin-bottom: 20px; }
.question-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; margin-bottom: 20px; min-height: 140px; display: flex; flex-direction: column; justify-content: center; }
.q-type-tag { font-family: "Space Mono", monospace; font-size: 10px; color: var(--accent); letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; }
.q-word { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px; }
.q-hint { font-size: 12px; color: var(--muted); }
.choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.choice-btn { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 16px 20px; font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; transition: all 0.18s; font-family: "Noto Sans KR", sans-serif; display: flex; align-items: center; gap: 12px; }
.choice-btn:hover:not(:disabled) { border-color: var(--accent); background: #1f1d2e; }
.choice-btn.correct { border-color: var(--success); background: rgba(44,182,125,0.12); }
.choice-btn.wrong { border-color: var(--error); background: rgba(239,69,101,0.10); }
.choice-btn:disabled { cursor: default; }
.choice-letter { font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 18px; }
.choice-btn.correct .choice-letter { color: var(--success); }
.choice-btn.wrong .choice-letter { color: var(--error); }
.feedback-box { background: var(--card); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; display: none; border-left: 4px solid var(--success); font-size: 13px; line-height: 1.6; }
.feedback-box.show { display: block; }
.feedback-box.wrong-fb { border-left-color: var(--error); }
.feedback-title { font-weight: 700; margin-bottom: 4px; font-size: 14px; }
.next-btn { width: 100%; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.18s; font-family: "Noto Sans KR", sans-serif; display: none; }
.next-btn.show { display: block; }
.next-btn:hover { background: var(--accent); color: var(--text); }
/* RESULT */
.result-screen { display: none; text-align: center; padding-top: 32px; }
.result-emoji { font-size: 64px; margin-bottom: 16px; }
.result-score { font-family: "Space Mono", monospace; font-size: 48px; font-weight: 700; color: var(--accent2); margin-bottom: 4px; }
.result-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
.result-detail { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 24px; text-align: left; }
.result-detail h3 { font-size: 13px; color: var(--muted); margin-bottom: 14px; letter-spacing: 1px; }
.wrong-word-item { border-bottom: 1px solid var(--border); padding: 10px 0; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; }
.wrong-word-item:last-child { border-bottom: none; }
.wrong-w { font-weight: 700; }
.wrong-m { color: var(--muted); }
.result-btns { display: flex; gap: 12px; }
.result-btn { flex: 1; padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; font-family: "Noto Sans KR", sans-serif; transition: all 0.18s; }
.result-btn.primary { background: var(--accent); color: var(--text); }
.result-btn.primary:hover { background: #ff8555; }
.result-btn.secondary { background: var(--card); color: var(--text); border: 2px solid var(--border); }
.result-btn.secondary:hover { border-color: var(--accent); }
/* REVIEW */
.review-screen { display: none; }
.review-title { font-size: 20px; font-weight: 900; margin-bottom: 20px; }
.review-list { display: flex; flex-direction: column; gap: 10px; }
.review-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; cursor: pointer; transition: border-color 0.15s; }
.review-item:hover { border-color: var(--accent); }
.review-item .ri-word { font-size: 18px; font-weight: 700; }
.review-item .ri-meaning { color: var(--muted); font-size: 13px; margin-top: 4px; }
.review-item .ri-extra { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.7; }
.review-item.open .ri-extra { display: block; }
.back-btn { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 8px 0; margin-bottom: 16px; font-family: "Noto Sans KR", sans-serif; display: flex; align-items: center; gap: 6px; }
.back-btn:hover { color: var(--text); }
@media (max-width: 400px) {
  .q-word { font-size: 22px; }
  .home-hero { font-size: 40px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">수능특강 VOCA</div>
  <div class="streak-badge">
    <span>🔥</span>
    <span id="streakNum">0</span>일 연속

        <div class="mode-desc">무작위 출제</div>

    </div>
    <div class="choices" id="choicesDiv"></div>
    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div id="feedbackSyn"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 →</button>
  </div>

  <!-- RESULT -->
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-score" id="resultScore">5/5</div>
    <div class="result-sub" id="resultSub">오늘도 수고했어!</div>
    <div class="result-detail" id="wrongList" style="display:none"></div>
    <div class="result-btns">
      <button class="result-btn secondary" onclick="goHome()">홈으로</button>
      <button class="result-btn primary" onclick="retryWrong()" id="retryBtn" style="display:none">오답 다시풀기</button>
    </div>
  </div>

  <!-- REVIEW -->
  <div class="review-screen" id="reviewScreen">
    <button class="back-btn" onclick="goHome()">← 홈으로</button>
    <div class="review-title">📖 전체 단어장</div>
    <div id="reviewList" class="review-list"></div>
  </div>

</div>

var state = {
  mode: 'daily',
  questions: [],
  current: 0,
  score: 0,
  wrongWords: [],
  answered: false,
  totalDone: parseInt(localStorage.getItem('voca_done')||'0'),
  streak: parseInt(localStorage.getItem('voca_streak')||'0'),
  lastDate: localStorage.getItem('voca_date')||''
};

function init() {
  updateStreak();
  document.getElementById('streakNum').textContent = state.streak;
  document.getElementById('statStreak').textContent = state.streak;
  document.getElementById('statDone').textContent = state.totalDone;
  var wrong = JSON.parse(localStorage.getItem('voca_wrong')||'[]');
  document.getElementById('retryDesc').textContent = wrong.length > 0 ? (wrong.length + '개 틀린 단어') : '틀린 단어 없음';
}

function updateStreak() {
  var today = new Date().toDateString();
  var yesterday = new Date(Date.now() - 86400000).toDateString();
  if (state.lastDate === today) return;
  if (state.lastDate !== yesterday && state.lastDate !== '') state.streak = 0;
}

function saveStreak() {
  var today = new Date().toDateString();
  if (state.lastDate === today) return;
  var yesterday = new Date(Date.now() - 86400000).toDateString();
  state.streak = (state.lastDate === yesterday) ? state.streak + 1 : 1;
  state.lastDate = today;
  localStorage.setItem('voca_streak', state.streak);
  localStorage.setItem('voca_date', today);
}

function selectMode(m) {
  state.mode = m;
  ['daily','retry','random'].forEach(function(x) {
    document.getElementById('mode' + x.charAt(0).toUpperCase() + x.slice(1)).classList.remove('highlight');
  });
  document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('highlight');
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function getPool() {
  if (state.mode === 'retry') {
    var saved = JSON.parse(localStorage.getItem('voca_wrong')||'[]');
    if (!saved.length) { alert('틀린 단어가 없어요! 먼저 퀴즈를 풀어봐요.'); return null; }

  if (state.mode === 'random') return shuffle(WORDS.slice()).slice(0,10);
  // daily: 날짜 기반 5문제
  var dayIdx = Math.floor(Date.now() / 86400000);
  var start = (dayIdx * 5) % WORDS.length;
  var pool = [];
  for (var i = 0; i < 5; i++) pool.push(WORDS[(start+i) % WORDS.length]);
  return pool;
}

function makeQ(wordObj) {
  var type = Math.random() < 0.65 ? 0 : 1; // 0=word->meaning, 1=meaning->word
  var qText, correct, choices, label;
  if (type === 0) {
    label = '뜻 맞추기';
    qText = wordObj.w;
    correct = wordObj.m;
    var pool = shuffle(WORDS.filter(function(w){ return w !== wordObj && w.m !== wordObj.m; })).slice(0,3).map(function(w){ return w.m; });
    choices = shuffle([correct].concat(pool));
  } else {
    label = '단어 맞추기';
    qText = wordObj.m;
    correct = wordObj.w;
    var pool2 = shuffle(WORDS.filter(function(w){ return w !== wordObj; })).slice(0,3).map(function(w){ return w.w; });
    choices = shuffle([correct].concat(pool2));
  }
  return { label: label, qText: qText, correct: correct, choices: choices, obj: wordObj };
}

function startQuiz() {
  var pool = getPool();
  if (!pool) return;
  state.questions = pool.map(makeQ);
  state.current = 0; state.score = 0; state.wrongWords = []; state.answered = false;
  showScreen('quiz');
  renderQ();
}

function renderQ() {
  var q = state.questions[state.current];
  var total = state.questions.length;
  document.getElementById('progressFill').style.width = ((state.current/total)*100) + '%';
  document.getElementById('progressLabel').textContent = (state.current+1) + ' / ' + total;
  document.getElementById('qTypeTag').textContent = q.label;
  document.getElementById('qWord').textContent = q.qText;
  document.getElementById('qHint').textContent = '';

  var div = document.getElementById('choicesDiv');
  div.innerHTML = '';
  var letters = ['A','B','C','D'];
  q.choices.forEach(function(c, i) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = '<span class="choice-letter">' + letters[i] + '</span><span>' + c + '</span>';
    btn.onclick = function(){ answer(btn, c, q); };
    div.appendChild(btn);
  });

  document.getElementById('feedbackBox').className = 'feedback-box';
  document.getElementById('nextBtn').className = 'next-btn';
  state.answered = false;
}

function answer(btn, chosen, q) {
  if (state.answered) return;
  state.answered = true;
  document.querySelectorAll('.choice-btn').forEach(function(b) {
    b.disabled = true;
    var txt = b.querySelectorAll('span')[1].textContent;
    if (txt === q.correct) b.classList.add('correct');
  });
  var ok = chosen === q.correct;
  if (ok) { state.score++; btn.classList.add('correct'); }
  else { btn.classList.add('wrong'); state.wrongWords.push(WORDS.indexOf(q.obj)); }

  var box = document.getElementById('feedbackBox');
  box.className = 'feedback-box show' + (ok ? '' : ' wrong-fb');
  document.getElementById('feedbackTitle').textContent = ok ? '✓ 정답!' : ('✗ 정답: ' + q.correct);
  var extra = '';
  if (q.obj.s) extra += '<strong style="color:var(--accent2)">동의어</strong> ' + q.obj.s;
  if (q.obj.a) extra += (extra ? '<br>' : '') + '<strong style="color:var(--muted)">반의어</strong> ' + q.obj.a;
  document.getElementById('feedbackSyn').innerHTML = extra;
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  state.current++;
  if (state.current >= state.questions.length) showResult();
  else renderQ();
}

function showResult() {
  saveStreak();
  state.totalDone += state.questions.length;
  localStorage.setItem('voca_done', state.totalDone);

  var prevWrong = JSON.parse(localStorage.getItem('voca_wrong')||'[]');
  var merged = prevWrong.concat(state.wrongWords).filter(function(v,i,a){ return a.indexOf(v)===i; });
  localStorage.setItem('voca_wrong', JSON.stringify(merged));

  document.getElementById('streakNum').textContent = state.streak;
  document.getElementById('statStreak').textContent = state.streak;
  document.getElementById('statDone').textContent = state.totalDone;

  var total = state.questions.length;
  var score = state.score;
  var emojis = ['😭','😢','🙁','😐','🙂','😊','😄','🥳','🌟','🎉','🏆'];
  document.getElementById('resultEmoji').textContent = emojis[Math.round((score/total)*10)];
  document.getElementById('resultScore').textContent = score + '/' + total;
  var msgs = ['다시 도전해봐!','조금만 더!','절반 성공!','잘하고 있어!','거의 다야!','훌륭해!','완벽해!'];
  document.getElementById('resultSub').textContent = msgs[Math.min(Math.floor(score/(total/6)),6)];

  var wl = document.getElementById('wrongList');
  if (state.wrongWords.length > 0) {
    var html = '<h3>틀린 단어</h3>';
    state.wrongWords.forEach(function(idx) {
      var w = WORDS[idx];
      if (w) html += '<div class="wrong-word-item"><span class="wrong-w">' + w.w + '</span><span class="wrong-m">' + w.m + '</span></div>';
    });
    wl.innerHTML = html; wl.style.display = '';
    document.getElementById('retryBtn').style.display = '';
  } else {
    wl.style.display = 'none';
    document.getElementById('retryBtn').style.display = 'none';
  }
  showScreen('result');
}

function retryWrong() { selectMode('retry'); startQuiz(); }

function goHome() {
  var wrong = JSON.parse(localStorage.getItem('voca_wrong')||'[]');
  document.getElementById('retryDesc').textContent = wrong.length > 0 ? (wrong.length + '개 틀린 단어') : '틀린 단어 없음';
  showScreen('home');
}

function goReview() {
  var list = document.getElementById('reviewList');
  list.innerHTML = '';
  WORDS.forEach(function(w) {
    var div = document.createElement('div');
    div.className = 'review-item';
    var extra = '';
    if (w.s) extra += '<div>동의어: <strong style="color:var(--accent2)">' + w.s + '</strong></div>';
    if (w.a) extra += '<div style="margin-top:4px">반의어: ' + w.a + '</div>';
    div.innerHTML = '<div class="ri-word">' + w.w + '</div><div class="ri-meaning">' + w.m + '</div><div class="ri-extra">' + extra + '</div>';
    div.onclick = function(){ div.classList.toggle('open'); };
    list.appendChild(div);
  });
  showScreen('review');
}

function showScreen(name) {
  ['home','quiz','result','review'].forEach(function(s) {
    document.getElementById(s+'Screen').style.display = s === name ? '' : 'none';
  });
}


function tryGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function trySet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

// patch state to use tryGet
state.totalDone = parseInt(tryGet('voca_done')||'0');
state.streak = parseInt(tryGet('voca_streak')||'0');
state.lastDate = tryGet('voca_date')||'';

// patch saves
var _origSaveStreak = saveStreak;
saveStreak = function(){
  var today = new Date().toDateString();
  if(state.lastDate===today) return;
  var yesterday = new Date(Date.now()-86400000).toDateString();
  state.streak=(state.lastDate===yesterday)?state.streak+1:1;
  state.lastDate=today;
  trySet('voca_streak',state.streak);
  trySet('voca_date',today);
};

document.addEventListener('DOMContentLoaded', function(){
  init();
  showScreen('home');
});

</script>
